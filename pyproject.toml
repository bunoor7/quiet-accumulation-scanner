[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quiet-accumulation-scanner"
version = "0.1.0"
description = "Quiet-accumulation screener for liquid altcoins, read directly from Binance/OKX public market data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
accscan = "accscan.cli:run"

[tool.setuptools.packages.find]
where = ["src"]
